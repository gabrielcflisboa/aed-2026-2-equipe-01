app:
  topico: vendas.ingresso.reservado.v1

  # Regra de negocio do publisher. Numeros de exemplo: com limite 4, o
  # exemplo-reserva.json (3 ingressos) passa na primeira vez e e recusado
  # na segunda, que e a demonstracao do ponto de decisao.
  limite-por-cpf: 4

  # Capacidade declarada de cada setor. Nao e o estoque: o estoque real,
  # com o que ja foi vendido, e do servico-ingressos.
  setores:
    PISTA: 100
    CAMAROTE: 20
    ARQUIBANCADA: 50

spring:
  application:
    name: servico-vendas

  kafka:
    bootstrap-servers: localhost:19092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # JacksonJsonSerializer, e nao JsonSerializer: o Spring Boot 4 traz a
      # Jackson 3 (tools.jackson). O JsonSerializer antigo ainda existe no
      # spring-kafka, mas procura com.fasterxml.jackson.databind, que nao esta
      # mais no classpath — e quebra so na hora de criar o produtor.
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # o consumidor usa a classe dele proprio para desserializar; nao precisamos
        # anunciar o tipo Java nos cabecalhos
        spring.json.add.type.headers: false

logging:
  level:
    root: WARN
    br.pucminas.aed: INFO
    org.springframework.boot: INFO
  pattern:
    console: "%d{HH:mm:ss} %-5level %-28logger{0} : %msg%n"
