app:
  topico: vendas.ingresso.reservado.v1
  topico-liberacoes: vendas.ingresso.liberado.v1
  topico-pagamentos-recusados: pagamentos.pagamento.recusado.v1
  evento:
    origem: servico-vendas
    tipo: vendas.ingresso.reservado.v1
    tipo-liberacoes: vendas.ingresso.liberado.v1
  gateway:
    origem: gateway-de-pagamento-simulado
    tipo-pagamentos-recusados: pagamentos.pagamento.recusado.v1

  # Numeros justificados no ADR-006.
  resiliencia:
    retentativas: 4
    espera-inicial-ms: 1000
    multiplicador: 2.0
    espera-maxima-ms: 8000
    sufixo-dlq: .dlq
    retencao-dlq-dias: 30
    espera-da-confirmacao-ms: 10000

  # Regra de negocio do publisher. Numeros de exemplo: com limite 4, o
  # exemplo-reserva.json (3 ingressos) passa na primeira vez e e recusado
  # na segunda, que e a demonstracao do ponto de decisao.
  limite-por-cpf: 4

  # Capacidade declarada de cada setor. Nao e o estoque: o estoque real,
  # com o que ja foi vendido, e do servico-ingressos.
  setores:
    PISTA: 100
    CAMAROTE: 20
    ARQUIBANCADA: 50

spring:
  application:
    name: servico-vendas

  kafka:
    bootstrap-servers: localhost:19092
    consumer:
      group-id: servico-vendas
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        # o consumidor usa a classe dele proprio para desserializar; nao precisamos
        # anunciar o tipo Java nos cabecalhos
        spring.json.add.type.headers: false
    listener:
      ack-mode: manual_immediate

logging:
  level:
    root: WARN
    br.pucminas.aed: INFO
    org.springframework.boot: INFO
  pattern:
    console: "%d{HH:mm:ss} %-5level %-28logger{0} : %msg%n"