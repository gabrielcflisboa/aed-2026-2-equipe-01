app:
  topico: vendas.ingresso.reservado.v1
  topico-reservas: vendas.ingresso.reservado.v1
  topico-liberacoes: vendas.ingresso.liberado.v1

  agregador:
    group-id: servico-ingressos-agregador-teste
    tamanho-da-janela-em-segundos: 60

  # Sem `abertura`: cada teste abre os setores que usa. Nao declarar a chave e
  # proposital, porque `abertura: {}` chega ao binder como a string "{}".

  projecoes:
    # Teto da defasagem das telas, em ms. Ver docs/entregas/aula-05.md.
    intervalo: 1000

  # Esperas curtas para os testes com Kafka embutido nao demorarem.
  resiliencia:
    retentativas: 2
    espera-inicial-ms: 100
    multiplicador: 2.0
    espera-maxima-ms: 200
    sufixo-dlq: .dlq
    retencao-dlq-dias: 30
    retencao-deduplicacao-dias: 45
    dlqs-reprocessaveis: vendas.ingresso.reservado.v1.dlq,vendas.ingresso.liberado.v1.dlq,pagamentos.pagamento.recusado.v1.dlq

spring:
  application:
    name: servico-ingressos

  datasource:
    url: jdbc:h2:mem:ingressos-teste;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

  sql:
    init:
      mode: always

  kafka:
    bootstrap-servers: localhost:19092
    # Sem broker nos testes comuns: o KafkaAdmin nao tenta criar as DLQs.
    admin:
      auto-create: false
    consumer:
      group-id: servico-ingressos-teste
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: manual_immediate
      auto-startup: false

logging:
  level:
    root: WARN
    br.pucminas.aed: INFO
