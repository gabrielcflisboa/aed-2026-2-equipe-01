app:
  topico: vendas.ingresso.reservado.v1
  topico-reservas: vendas.ingresso.reservado.v1
  topico-compensacoes: vendas.ingresso.reserva-compensada.v1

  agregador:
    group-id: servico-ingressos-agregador-teste
    tamanho-da-janela-em-segundos: 60

  # Sem `abertura`: cada teste abre os setores que usa. Nao declarar a chave e
  # proposital, porque `abertura: {}` chega ao binder como a string "{}".

  projecoes:
    # Teto da defasagem das telas, em ms. Ver docs/entregas/aula-05.md.
    intervalo: 1000

spring:
  datasource:
    url: jdbc:h2:mem:ingressos-teste;DB_CLOSE_DELAY=-1
    username: sa
    password: ""

  sql:
    init:
      mode: always

  kafka:
    bootstrap-servers: localhost:19092
    consumer:
      group-id: servico-ingressos-teste
    listener:
      ack-mode: manual
      auto-startup: false

logging:
  level:
    root: WARN
    br.pucminas.aed: INFO
