spring.application.name=servico-ingressos
server.port=8082
spring.datasource.url=jdbc:h2:file:./data/ingressos;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.kafka.bootstrap-servers=localhost:19092
spring.kafka.consumer.group-id=servico-ingressos
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=manual_immediate
app.topico-reservas=vendas.ingresso.reservado.v1
app.topico-compensacoes=vendas.ingresso.reserva-compensada.v1

# Aula 03: agregador com group.id proprio, no mesmo topico de reservas.
app.agregador.group-id=servico-ingressos-agregador-reservas
app.agregador.tamanho-da-janela-em-segundos=60